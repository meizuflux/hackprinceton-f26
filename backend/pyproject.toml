[project]
name = "mapletrace-backend"
version = "0.1.0"
description = "MapleTrace backend: evidence ingestion, reasoning pipeline and HTTP API"
requires-python = ">=3.11"
dependencies = [
    # ingestion
    "pillow>=10",
    "python-dateutil>=2.8",
    "hachoir>=3.2",
    "pypdf>=4",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "tzdata>=2024.1",
    # reasoning (traditional ML)
    "numpy>=2.0",
    "scikit-learn>=1.5",
    # API
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # LLM layer (--llm, chat): LangChain deep agents + Anthropic
    "deepagents>=0.7.38,<0.8",
    "langchain-anthropic>=1.7",
    # xxhash 4.x ships a DLL that Windows Smart App Control blocks on some machines; 3.5 works everywhere
    "xxhash>=3.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
# Not an installable package: the code finds backend/demo and backend/llm_cache relative to its own
# files, so commands run from backend/ (`uv run python -m mapletrace_api ...`) against the synced env.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
