# Strip the /api prefix the same way Vite's dev proxy does (vite.config.ts): forward the raw,
# still-encoded request URI and query string, so /api/cases/x%2Fy?q=1 becomes /cases/x%2Fy?q=1.
map $request_uri $api_uri {
    ~^/api(?<rest>/.*)$ $rest;
    default /;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolve the backend through Docker's embedded DNS per request, so nginx starts even
        # without a backend (the mock-only image) and follows a restarted backend container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8000;
        # With variables in proxy_pass, nginx sends $api_uri as is, without re-normalising it.
        proxy_pass $api_upstream$api_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Case ZIP uploads; matches the backend's MAPLETRACE_MAX_UPLOAD_MB default (100).
        client_max_body_size 100m;
        proxy_request_buffering off;

        # Analysis polling, original-evidence downloads and chat replies can be slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
