# Single-host deployment. Keep upload limit aligned with frontend/nginx.conf.
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      MAPLETRACE_DATA: /data
      MAPLETRACE_MAX_UPLOAD_MB: "100"
      MAPLETRACE_CORS: ${MAPLETRACE_CORS:-}
      MAPLETRACE_LLM_MODEL: ${MAPLETRACE_LLM_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - mapletrace-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mapletrace-data:
