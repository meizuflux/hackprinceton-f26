# MapleTrace: FastAPI backend + Caddy-served frontend. Open http://localhost:5173.
# The frontend proxies /api/ to the backend; only the frontend is published, on loopback.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MAPLETRACE_DATA: /data
      MAPLETRACE_MAX_UPLOAD_MB: "100"
      MAPLETRACE_CORS: http://localhost:5173,http://127.0.0.1:5173
      # Models per role, provider:model (backend/README.md, "Choosing models"). Empty means the
      # default: chat and vision follow the investigator; labels use claude-haiku-5-5.
      MAPLETRACE_INVESTIGATOR_MODEL: ${MAPLETRACE_INVESTIGATOR_MODEL:-${MAPLETRACE_LLM_MODEL:-anthropic:claude-sonnet-5-5}}
      MAPLETRACE_CHAT_MODEL: ${MAPLETRACE_CHAT_MODEL:-}
      MAPLETRACE_VISION_MODEL: ${MAPLETRACE_VISION_MODEL:-}
      MAPLETRACE_LABELS_MODEL: ${MAPLETRACE_LABELS_MODEL:-}
      # Optional. Without a key, POST /demo and replayed LLM caches still work; only new
      # (unrecorded) LLM analyses need the key of the provider they use. Never commit a key;
      # export it or use a git-ignored .env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - mapletrace-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mapletrace-data:
